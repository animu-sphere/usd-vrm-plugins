# OpenStrata plain-library descriptor. vrmRetarget is the offline retarget core:
# complete and testable before any OpenExec node exists (motion policy §18.12).
schema: openstrata.library/v1alpha1
library:
  id: vrmRetarget
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.4.0
requires:
  libraries:
    - id: motionCore
      version: ">=0.4,<0.5"
    - id: motionRuntime
      version: ">=0.4,<0.5"
cmake:
  package: vrmRetarget
  target: vrmRetarget::vrmRetarget
