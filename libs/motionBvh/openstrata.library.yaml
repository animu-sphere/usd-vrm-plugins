# OpenStrata plain-library descriptor. motionBvh reads BVH syntax and stops
# there: `HIERARCHY`, `ROOT`/`JOINT`, `OFFSET`, `CHANNELS`, `End Site`,
# `MOTION`, a frame time, and channel values in declaration order.
#
# A library, not a plugin bundle: it registers nothing with OpenUSD and has no
# plugInfo.json (WORKSPACE.md §1). It is *inside* the aggregate product, unlike
# an adapter, because it carries no producer name -- only the profile data
# beside it does.
#
# One edge, and it is the only one this library ever acquires: the extractor
# turns a document into `motionSource` values (WORKSPACE.md §2). It never
# reverses -- the day `motionSource` gains a BVH-shaped field is the day a second
# reader cannot be added -- and motionCore arrives only through it, never named
# here and never named in this library's code.
schema: openstrata.library/v1alpha1
library:
  id: motionBvh
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.8.0
requires:
  libraries:
    - id: motionSource
      version: ">=0.8,<0.9"
cmake:
  package: motionBvh
  target: motionBvh::motionBvh
