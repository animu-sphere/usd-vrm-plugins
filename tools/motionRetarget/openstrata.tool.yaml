# OpenStrata workspace-tool descriptor. motion_retarget is a user-facing
# deliverable no bundle requires, so the workspace graph never reaches it; this
# descriptor is what lets `ost plugin package --workspace --product` ship it.
schema: openstrata.tool/v1alpha1
tool:
  id: motion_retarget
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.9.0
  license: Apache-2.0
executables: [motion_retarget]
directories: [bin]
requires:
  libraries:
    - id: vrmRig
      version: ">=0.9,<0.10"
    # By name rather than only through another library, the way `motion_bvh`
    # declares `motionSource`: the tool resamples the clip itself so that the
    # body and the face expand one sample list, which is an edge of its own and
    # not one to be inferred from a dependency that could stop being transitive.
    # What was one `motionRuntime` is two published packages now, and this tool
    # names the half it uses -- the resample is `motionSampling`'s -- plus the
    # core its values come from.
    - id: motionCore
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:2aa549d1d764ef99527f31b71533133ac1c98e48843c63feccf6c69cc551219d
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:32b6ba1bc4b155278fbc388e24a0e9130f19540be9a980cb48bf049637bfe9e7
          cy2026-macos-arm64-py313-usd:
            digest: sha256:0a2c796e1929abcca6b4bba75509b8139a1fd757cb1c4fe6f9a165eee55e8d49
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:54f62ff034b02babe2470a78d78aa18c44b4c2245d09d53ec7d7af0ccc6888e0
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:f06fef790e19371c3d085c667e44805d738b63e8af77df2d8fafa6a41d5969a5
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:7e5c67b9ae5defa40887b7dbaccea0bb5258ae3e86b1e2d14e7c82ae13ce0564
    # The retarget itself, which this tool bakes onto a VRM avatar, and the two
    # builders it reads a skeleton and a clip's rest through -- the ones `execVrm`
    # calls, so the two read one rig off one stage.
    - id: motionRetarget
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:16f18e2808e44569b6251faf163bd6f91387058fe1e009608af7d631d776ee67
