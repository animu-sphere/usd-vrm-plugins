# OpenStrata workspace-tool descriptor. motion_retarget is a user-facing
# deliverable no bundle requires, so the workspace graph never reaches it; this
# descriptor is what lets `ost plugin package --workspace --product` ship it.
schema: openstrata.tool/v1alpha1
tool:
  id: motion_retarget
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.12.0
  license: Apache-2.0
executables: [motion_retarget]
directories: [bin]
requires:
  libraries:
    - id: vrmRig
      version: ">=0.12,<0.13"
    # By name rather than only through another library: the tool resamples the
    # clip itself so that the body and the face expand one sample list, which is
    # an edge of its own and not one to be inferred from a dependency that could
    # stop being transitive.
    # What was one `motionRuntime` is two published packages now, and this tool
    # names the half it uses -- the resample is `motionSampling`'s -- plus the
    # core its values come from.
    - id: motionCore
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:8b18c442e74aed488bc7fb9a9aa1b0ec8759c9949de9099802237f7da365f5c6
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:5b525a4f2065022a87c0f940e9a4497b8edaaa0ba4dffedf81a65df0bc544f08
          cy2026-macos-arm64-py313-usd:
            digest: sha256:26d71d60eb9f45a518cd10c4c153af3e157bae740064968fea233a4e7d65130f
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:4c94586167cc31e684b96038dde01d367690b4ead8e02bbe7e2a7bf7cdae70d4
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:7c3472097fa7a75d28769a1f48c5c031294955b91b4663deed64534dd156124b
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:34495585c29c55a719d332b69482325e082b573eac7213a46113a2e02394b708
    # The retarget itself, which this tool bakes onto a VRM avatar, and the two
    # builders it reads a skeleton and a clip's rest through -- the ones `execVrm`
    # calls, so the two read one rig off one stage.
    - id: motionRetarget
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:a625f0318500f7017fdfd1d74feb2d5df256b0251b2d888971e1184b91f3a6ac
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:cf39ab69124c9fe1c8ae4fffa222dc016d35800922ce313d2d7853b2a53faf0f
