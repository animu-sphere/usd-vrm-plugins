    # The clip's reading half: skeleton and animation discovery, the pose at a
    # time code, the producer's rate. This tool is the only consumer it has
    # here, which is why it waited for `ost` 0.23.3 -- the first release that
    # materializes an artifact only a tool declares (ost report 44). What the
    # tool still reads itself is the `vrm:` half: the expression tracks, the
    # gaze track and the look-at offset, which the library refuses on purpose.
