# OpenStrata CI support matrix for usd-vrm-plugins.
#
# Policy: this file is the CI contract; .github/workflows/ost-*.yml are
# renderer output from `ost ci generate github`. Do not hand-edit CI
# semantics in the generated workflow YAML. As of ost 0.21.0 there is no
# standing exception to that policy: every Linux cell's X11 requirement is
# declared below as `host_packages`, so regeneration re-renders the step
# instead of deleting a hand-added one.
#
#   X11 BACKGROUND. OpenUSD 26.08's MaterialX 1.39.5 exports an unconditional
#   `find_dependency(X11 REQUIRED COMPONENTS Xt)` on non-Apple UNIX, so a Linux
#   consumer of the 26.08 runtime cannot even configure without X11 dev
#   headers. Diagnosis: docs/reports/ost/31-2026-07-26-v0.20.0-materialx-x11-ci-host-deps.md
#
#   IT STILL APPLIES TO HAND-AUTHORED WORKFLOWS. release.yml is not generated
#   from this file and carries its own apt step; it was missed when CI was
#   re-pinned to 26.08 and the v0.5.0 tag build failed on it, because a green
#   PR lane does not exercise release.yml. When you add a Linux job to a
#   hand-authored workflow, add the step with it.
#
# Lanes:
#   - pull_request  -> GitHub-hosted source build from checkout. The runner
#                      bootstraps a pinned `ost` and pulls the runtime SDK from
#                      its OCI reference (runtime_remote) below. Both cell
#                      kinds live here: `bundle:` cells run the per-bundle
#                      verification pyramid, `kind: workspace` cells build the
#                      root CMake tree (see the workspace cells at the end).
#   - scheduled     -> self-hosted real compatibility validation from pinned
#                      runtime + plugin artifacts (air-gapped local import).
#
# Digest provenance:
#   All three runtimes are OpenUSD 26.08, built from tag v26.08
#   (ee47c679abde5b467a7b6a41f3b2285564a4222e) with Python 3.13 and
#   `--examples`, so the OpenExec/ExecIr sample material ships inside the
#   runtime. All three were exported with the `full` layout profile: 26.08 puts
#   every example under `share/`, and `--slim` does not carry `share/`. Each
#   carries an SPDX SBOM and SLSA/in-toto provenance and verifies
#   `trust: attested`, which is what the `--require-sbom --require-provenance`
#   gate `ost ci generate` renders demands.
#
#   None of the three was produced by `ost runtime pull --build`: that path
#   hardcodes `--no-examples` and `--build-arg` is appended rather than
#   substituted, so `--examples` is unreachable through it. All three were built
#   by driving `build_usd.py` directly and adopting with `--from-usd`, which
#   costs the `build` provenance — they are recorded `source: local`.
#   Windows and Linux: docs/reports/ost/29-2026-07-26-v0.20.0-openusd-2608-runtime-publish.md
#   macOS arm64:       docs/reports/ost/30-2026-07-26-v0.20.0-macos-2608-runtime-publish.md
#
#   The OCI manifest digest is NOT stable across republishes (provenance embeds
#   the producing commit), so `expected_oci_digest` below must be re-pinned from
#   the push output every time, while `runtime_artifact` stays put.
#   Windows runtime: OpenUSD 26.08, validated, with top-level resources/ and
#            lib/python schema-gen deps.
#            OST artifact sha256:e3368364... / OCI sha256:184cdbb4...
#            4267 files / 109,651,464 B
#   macOS arm64 runtime: OpenUSD 26.08, validated, with executable tool modes
#            preserved, and published publicly to GHCR.
#            OST artifact sha256:b2cb7b68... / OCI sha256:f8de29a4...
#            4398 files / 117,272,452 B
#            Requires ost 0.12.0+ for executable-bit preserving macOS
#            archive export/import. Built with Apple clang 16 against the
#            macOS 15.2 SDK: 26.08's Hd data sources rely on
#            `allocate_shared` routing through the allocator, which the
#            macOS 14.5 SDK's libc++ only does under C++20.
#   Linux x86_64 runtime: OpenUSD 26.08 built inside a ubuntu:24.04 (glibc 2.39)
#            container so the runtime's real glibc floor is 2.38 -- loadable on
#            the github-hosted ubuntu-24.04 runner. ost 0.12.0 measures the
#            floor and stamps the honest target linux-x86_64-glibc238-py313.
#            OST artifact sha256:70b47d1b... / OCI sha256:1a873111...
#            4162 files / 125,696,921 B
#            Published publicly to GHCR.
#   plugin:  ost plugin publish plugins/usdVrmFileFormat  (usdVrmFileFormat 0.1.0, ost 0.13.0 lean
#            package — reproducible digest, debug symbols split into *-debug)
#            NOTE: this artifact was built against the 26.05 runtime. The
#            scheduled lane below now pins a 26.08 runtime, so it validates a
#            26.05-built plugin against 26.08. OpenUSD guarantees no ABI
#            stability across versions; republish the plugin before trusting
#            that lane.
schema: 1

bootstrap:
  ost:
    version: "0.21.0"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required
  usd-windows-real:
    kind: self-hosted
    labels: [self-hosted, windows, x64, usd-26]

# ost 0.16+ makes both dependency edges executable: it consumes the
# `requires.bundles` closure (vrmSchema) AND the `requires.libraries` closure
# (the plain vrmContainer library, described by libs/vrmContainer/
# openstrata.library.yaml) for source build, test, run, and generated CI. Every
# consumer cell therefore exercises L0-L5 with its schema and library built,
# installed, and present in the session automatically — no repo-owned bootstrap
# or cell-local `with:` duplication.
#
# The Windows PR cells stay capped at L4: ost's hosted-Windows `usdcat --flatten
# --out` capture still injects semantic CR into multiline USDA string values
# (authored comments and generated `doc`) even from an LF-pinned fixture/golden,
# and the golden compare preserves semantic CRLF by design, so L5 mismatches.
# This is not reproducible on a local worktree; see the Phase 3 dogfood report.
# macOS and Linux cells run full L5. usdVrmPackageResolver's fixtures are chosen
# so its own L5 golden is host-independent, but its Windows cell is capped for
# consistency until the hosted-Windows capture is confirmed fixed.
cells:
  - name: usdvrmfileformat-pr-windows
    lane: pull_request
    runner: windows-hosted
    runtime_artifact: sha256:e3368364f8f4661a7c34371e907f2e5ddcdec4e680b76f5e9e1c1ed656022f48
