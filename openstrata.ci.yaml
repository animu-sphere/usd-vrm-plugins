  # --- Workspace cells (ost 0.21.0) -------------------------------------
  #
  # A `bundle:` cell only ever reaches a plugin bundle. The plain libraries
  # (libs/*/openstrata.library.yaml), the CLI tools
  # (tools/*/openstrata.tool.yaml) and the adapters are built by the ROOT CMake
  # tree and no bundle requires them, so twelve bundle cells leave them
  # untested. These cells build that tree: `ost build` then `ost test`, which is
  # the whole CTest suite -- motionCore, motionRuntime (incl. live capture and
  # the capture corpus), vrmRetarget, vrmContainer, motionBvh (incl. the
  # recorded corpus), vrmAdapterVmc, every CLI, and usdvrm_baseline, the
  # whole-workspace behavior gate that no other lane runs (it had been silently
  # stale for a release before v0.5.0 caught it). The count is deliberately not
  # written down here: the last one said 22 and was stale by two releases.
  #
  # This replaces the hand-authored motion-ci.yml, which was ~210 lines of
  # which ~120 duplicated generated logic and which could never finish: a bare
  # `cmake` could not configure against a pulled runtime. 0.21.0's `plugin run`
  # exports CMAKE_TOOLCHAIN_FILE and `ost build` uses it, so the lane is
  # expressible in the contract instead. See
  # docs/reports/ost/33-2026-07-28-v0.21.0-workspace-ci-adoption.md
  - name: workspace-graph-pr
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    # A graph cell never materializes a runtime -- the rendered job stops after
    # the checkout -- but the contract still wants the pin on record.
    runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
      expected_oci_digest: sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
    platform: cy2026
    profile: usd
    # The WORKSPACE.md §2 dependency-direction gate, in milliseconds, before
    # anything is built. It catches a forbidden edge and a half-bumped
    # workspace: verified to fail with WORKSPACE_LIBRARY_DEPENDENCY_VERSION_MISMATCH.
    verify: graph

  - name: workspace-pr-windows
    kind: workspace
    lane: pull_request
    runner: windows-hosted
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
      expected_oci_digest: sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
    platform: cy2026
    profile: usd
    # Required here even though the Windows *bundle* cells do without it. This
    # cell runs the root tree's native CTest executables, and the Windows
    # runtime bundles no interpreter: its USD DLLs import python313.dll, which
    # must therefore be on PATH for a plain .exe to start at all. Without
    # setup-python the DLL lives only in the hosted tool cache, off PATH, and
    # every USD-linking test exits 0xc0000135 (DLL not found) while the
    # Python-driven tests still pass, because a python.exe finds its own DLL
    # beside it. Same reason release.yml pins it on the Windows cell.
    host_python: "3.13"
    verify: test

