# OpenStrata CI support matrix for usd-vrm-plugins.
#
# Policy: this file is the CI contract; .github/workflows/ost-*.yml are
# renderer output from `ost ci generate github`. Do not hand-edit CI
# semantics in the generated workflow YAML. As of ost 0.22.6 there is no
# standing exception to that policy: every Linux cell's X11 requirement is
# declared below as `host_packages`, so regeneration re-renders the step
# instead of deleting a hand-added one.
#
#   X11 BACKGROUND. OpenUSD 26.08's MaterialX 1.39.5 exports an unconditional
#   `find_dependency(X11 REQUIRED COMPONENTS Xt)` on non-Apple UNIX, so a Linux
#   consumer of the 26.08 runtime cannot even configure without X11 dev
#   headers. Diagnosis: docs/reports/ost/31-2026-07-26-v0.20.0-materialx-x11-ci-host-deps.md
#
#   IT STILL APPLIES TO HAND-AUTHORED WORKFLOWS. release.yml is not generated
#   from this file and carries its own apt step; it was missed when CI was
#   re-pinned to 26.08 and the v0.5.0 tag build failed on it, because a green
#   PR lane does not exercise release.yml. When you add a Linux job to a
#   hand-authored workflow, add the step with it.
#
# Lanes:
#   - pull_request  -> GitHub-hosted source build from checkout. The runner
#                      bootstraps a pinned `ost` and pulls the runtime SDK from
#                      its OCI reference (runtime_remote) below. Both cell
#                      kinds live here: `bundle:` cells run the per-bundle
#                      verification pyramid, `kind: workspace` cells build the
#                      root CMake tree (see the workspace cells at the end).
#   - scheduled     -> self-hosted real compatibility validation from pinned
#                      runtime + plugin artifacts (air-gapped local import).
#
# Digest provenance:
#   All three runtimes are canonical leaves of ost's own OpenUSD runtime matrix
#   (`support/openusd-runtime-matrix.json` in open-strata), published by
#   `support/publish-openusd-runtimes.ps1` under ost 0.22.3.
#
#   CONSUMING THEM NEEDS 0.22.6, and the three releases before it are why. Under
#   0.22.3 the macOS leaf failed `artifact pull` with ARTIFACT_MANIFEST_INVALID
#   and every Windows cell failed `runtime validate` with ten checks ok, two
#   skipped and zero failures. 0.22.4 fixed both and moved the failure: its new
#   Windows/macOS device probing made the render check run for real, and the
#   check ran `usdrecord` against whatever `python` was first on PATH -- 3.12 on
#   a hosted runner, against a py313 runtime. 0.22.5 resolves the interpreter
#   from the runtime's own contract -- and moved it again, onto `usdrecord`'s Qt
#   bindings, which an OpenUSD built without `--usdview` does not ship and no
#   lane can install (`host_packages` is apt and brew only). 0.22.6 preflights
#   those imports and reports the render check `skip` when they are absent, and
#   stops treating a software rasterizer as a physical device. All four were
#   consumer defects; no
#   artifact was ever wrong and none was republished, which is why
#   `bootstrap.ost.version` below is not the version that produced these leaves.
#
#   RE-PINNED TO 0.22.8 (2026-08-30), and it changes nothing about these
#   artifacts. `ost ci generate` renders the same lanes with a different version
#   string, and re-pulling a leaf leaves its CMake package byte-identical. The
#   bump is taken because 0.22.8 is current, not because it fixes anything here
#   -- and in particular it does NOT close the P1 in
#   docs/reports/ost/37-2026-08-30-v0.22.6-runtime-python-paths-from-the-producer.md:
#   every leaf still hands a consumer the Python paths of the machine that built
#   it, in `pxrConfig.cmake` and again in sixteen imported targets, and only a
#   republished runtime can change that. The installed-package consumer lane
#   (.github/workflows/package-consumer.yml) carries the workaround; every other
#   lane goes through `ost build` and never sees it.
#
#   Diagnosis: docs/reports/ost/36-2026-08-25-v0.22.3-canonical-runtimes-and-release-membership.md That matrix expands
#   to sixteen immutable leaves -- OpenUSD 26.05 and 26.08 x
#   linux/windows `core`/`gl`/`vulkan` and macOS arm64 `core`/`metal` -- each
#   tagged `<openusd-version>-<variant>-<os>-<arch>` in one repository. The three
#   pinned below are the 26.08 imaging leaves. They replace the hand-driven
#   runtimes of v0.5.0-v0.7.0, whose tags and manifests upstream has since
#   removed: every digest this file carried before 2026-08-25 now resolves to
#   MANIFEST_UNKNOWN, so this is a re-pin, not an upgrade of choice.
#
#   NOT `core`. A `core` leaf is built `--no-imaging --no-examples`, and
#   cmake/UsdVrmOpenUsd.cmake fails configure on any runtime missing
#   `usdExecImaging` -- one of the six OpenExec components it probes, and the one
#   that lives under pxr/usdImaging. `core` therefore cannot configure this
#   workspace at all. `gl` (Linux, Windows) and `metal` (macOS arm64) build
#   imaging and the OpenExec/ExecIr examples, and each was verified by its
#   producer through loader, physical device and render -- where the runtimes
#   these replace recorded `not-run` for all three.
#
#   All three are the same OpenUSD 26.08 source as before, tag v26.08
#   (ee47c679abde5b467a7b6a41f3b2285564a4222e), with Python 3.13, and are
#   exported with the `sdk` layout profile (`full` is retired). Each carries an
#   SPDX SBOM and SLSA/in-toto provenance and verifies `trust: attested`, which
#   is what the `--require-sbom --require-provenance` gate `ost ci generate`
#   renders demands. Unlike their predecessors they are recorded
#   `source: build`: the canonical producer keeps the build provenance that
#   adopting a hand-built tree with `--from-usd` used to cost.
#
#   The OCI manifest digest is NOT stable across republishes (provenance embeds
#   the producing commit), and as the deleted tags above show `runtime_artifact`
#   does not stay put either. Re-pin both from the producer's push output.
#   Windows runtime: leaf 26.08-gl-windows-x86_64, target
#            windows-x86_64-msvc143-py313, MSVC 19.40 / runtime >=14.40.
#            OST artifact sha256:ebb0c7da... / OCI sha256:d3ff79a6...
#            4171 files / 106,349,942 B
#   macOS arm64 runtime: leaf 26.08-metal-macos-arm64, target
#            macos-arm64-macos130-py313 -- the deployment target is part of the
#            target id now. Apple clang 17 against the macOS 15.5 SDK,
#            deployment target 13.0; Metal device observed and HgiMetal render
#            verified by the producer.
#            OST artifact sha256:8d132212... / OCI sha256:8486d942...
#            4296 files / 111,218,486 B
#   Linux x86_64 runtime: leaf 26.08-gl-linux-x86_64, target
#            linux-x86_64-glibc238-py313 -- gcc 14.2, glibc floor 2.38 measured
#            from ELF symbol versions, loadable on the github-hosted
#            ubuntu-24.04 runner.
#            OST artifact sha256:3bf31789... / OCI sha256:8d2d5994...
#            4096 files / 123,438,525 B
#   All three are published publicly to GHCR; a fork PR needs no registry
#   credential to pull them. Re-pin measured and recorded in
#   docs/reports/ost/36-2026-08-25-v0.22.3-canonical-runtimes-and-release-membership.md
#   plugin:  ost plugin publish plugins/usdVrmFileFormat  (usdVrmFileFormat 0.1.0, ost 0.13.0 lean
#            package — reproducible digest, debug symbols split into *-debug)
#            NOTE: this artifact was built against the 26.05 runtime. The
#            scheduled lane below now pins a 26.08 runtime, so it validates a
#            26.05-built plugin against 26.08. OpenUSD guarantees no ABI
#            stability across versions; republish the plugin before trusting
#            that lane.
schema: 1

bootstrap:
  ost:
    version: "0.22.8"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required
  usd-windows-real:
    kind: self-hosted
    labels: [self-hosted, windows, x64, usd-26]

# ost 0.16+ makes both dependency edges executable: it consumes the
# `requires.bundles` closure (vrmSchema) AND the `requires.libraries` closure
# (the plain vrmContainer library, described by libs/vrmContainer/
# openstrata.library.yaml) for source build, test, run, and generated CI. Every
# consumer cell therefore exercises L0-L5 with its schema and library built,
# installed, and present in the session automatically — no repo-owned bootstrap
# or cell-local `with:` duplication.
#
# The Windows PR cells stay capped at L4: ost's hosted-Windows `usdcat --flatten
# --out` capture still injects semantic CR into multiline USDA string values
# (authored comments and generated `doc`) even from an LF-pinned fixture/golden,
# and the golden compare preserves semantic CRLF by design, so L5 mismatches.
# This is not reproducible on a local worktree; see the Phase 3 dogfood report.
# macOS and Linux cells run full L5. usdVrmPackageResolver's fixtures are chosen
# so its own L5 golden is host-independent, but its Windows cell is capped for
# consistency until the hosted-Windows capture is confirmed fixed.
