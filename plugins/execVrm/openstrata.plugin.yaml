# OpenStrata plugin bundle manifest.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: execVrm
  version: 0.9.0
  kind: usd-exec
license: Apache-2.0
runtime:
  # The one OpenUSD version this plugin supports; see usdVrmFileFormat's
  # manifest for why the tolerated range was retired in v0.6.0.
  openusd: "==26.08"
  cxx_abi: inherit
provides:
  # Three schemas, and exactly one plugin in a session may declare each. 26.08
  # keys its Exec.Schemas metadata by schema type and refuses a second declarer
  # with a coding error, dropping that plugin's computations for the schema --
  # so the two exec bundles partition them (WORKSPACE.md §2): `UsdSkelAnimation`
  # is execMotion's, and `UsdSkelSkeleton` and the Vrm*API applied schemas are
  # this bundle's. Only the ones it registers on are declared today; the rest of
  # the Vrm*API set is reserved for it by that contract, not by this list.
  #
  # UsdSkelBindingAPI joined for vrm.computeBindingPose: UsdSkel's animation
  # binding is inherited from an ancestor with the API applied, and no shipped
  # plugin declares that schema (execGeom declares UsdGeomScope and
  # UsdGeomXformable, execIr its own three).
  - usd-exec:UsdSkelBindingAPI
  - usd-exec:UsdSkelSkeleton
  - usd-exec:UsdVrmHumanoidAPI
requires:
  capabilities: [usd-stage-read]
  libraries:
    # What a VRM rig adds to the retarget: VRM 1.0's required bones, which the
    # retarget and the rig's diagnostics are handed because `motionRetarget`
    # holds no required set of its own. The retarget itself is declared below.
    - id: vrmRig
      version: ">=0.9,<0.10"
    # And what the retarget is built on, named rather than left to the closure:
    # the vocabulary a humanoid binds (`openstrata::motion::HumanJoint`) is
    # motionCore's, and a bundle names what it spells.
    - id: motionCore
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:08455616fe7c7ee936161cf4231ed10051ca6bf447f922feac47d04a8f23eed0
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:4586e148440892f6838bcd46888ff03c7b31a0be84be54bf103ee2940a2389c0
          cy2026-macos-arm64-py313-usd:
            digest: sha256:970b5a1987c71b5154a76e7ca0d52dddbd309f5ce754c1311c8733d300db6539
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:eaf5e19cbd42779757b905b4b66f4be3e0493f545f0ef3908a38884443422f30
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:18ce3b990b976b03480b2c948a3435e533cf2d5eb703e4e3ba14d9822bf43547
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:f7edfb277d2c02c5bb90f847de9decfd593aa677f0deb438c47597add7ee1b43
    # The retarget itself, and the library every node here wraps: the rig a
    # computation answers with is `motionRetarget`'s `SkeletonDescriptor`,
    # `RetargetMap`, `RestPoseCorrection` and `RetargetedPose`. It was this
    # repository's `vrmRetarget` until usd-motion-plugins v0.5.0 published it,
    # with the two builders this bundle used to carry copies of.
    - id: motionRetarget
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:40a7d82e1d0d0ce438316cf476b831d1b91f924b99625a31fac3a854225445c2
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:e04035813c6b89b722e4dc15927dd2b8d9058f2411117f5d2fd5bb1cb08dfba6
          cy2026-macos-arm64-py313-usd:
            digest: sha256:dfbb04ae56fc63c77371165f41146d0ff599bb7d54f18d28bf4c4f4da83843b7
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:63907e420ec52a6d65f29e722734435f78bb351c0cc0dd46c7552ff838bd0cc4
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:18203f389c0b045056bcfe5b462c570c799fcff112e1fa6a9c1da6879835c225
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:21651895936f6985dfb6a27452f035295a66b922d74b7934da2104f3dbb2ba89
    # Not motionSampling or motionRecording, which were pinned here from MIG-1
    # until no source was found to include either (the CMake edge went with
    # them): the pose a retarget reads is sampled by execMotion, by name.
  # The typed Vrm*API schemas. Not linked: exec resolves `UsdVrmHumanoidAPI`
  # by TfType name when it reads this bundle's Exec block, so what this bundle
  # needs is vrmSchema's plugInfo registered in the session. Without it the
  # schema name is unknown and every computation on the humanoid is "not
  # found" -- measured in execVrm_humanoid.
  bundles:
    - id: vrmSchema
      version: ">=0.9,<0.10"
      contract: 1
    # execMotion, for the pose a retarget reads. Not linked either:
    # `vrm.computeBoundPose` reads `motion.sampleAnimation` by name across a
    # skeleton's `skel:animationSource`, and that computation is registered by
    # execMotion on `UsdSkelAnimation`, a schema this bundle may not declare
    # (WORKSPACE.md §2). Without it the rig computes and the animation is
    # dropped from the fan-in with no word from exec -- the bound pose's own
    # count is the only thing that notices, measured in
    # execVrm_retarget_without_exec_motion.
    #
    # It is usd-motion-plugins' published bundle, pinned by archive digest from
    # its v0.5.1 pin table: this repository's copy was deleted once the parity
    # rows passed against it (MIG-2). `ost` materializes it for every session
    # and, since 0.23.5, for the root build, whose suites find it through
    # OPENSTRATA_EXTERNAL_BUNDLE_execMotion_ROOT.
    - id: execMotion
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:32380bd747c551b000db32df5c310c55f1726e696376fc4d94a116814c3824a0
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:69f7c38dd0e3be8ef4c62b9cee2f438939d9ba2cf48dc5b1de2a99ae29926b5a
          cy2026-macos-arm64-py313-usd:
            digest: sha256:64475073ae25daf78e606da37e848381cc243b91ae47f9e550d1b3a4646670e7
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:aab047005fcbed026b75d9c8058e5c6574112b8c785fb7efa8966943fb57297c
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:2c41a6641ad3648f48d4ede5ab2ea25aca090db0047e30c8d609d55f01c80e31
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:bde27ed0778a0fd624449af6957562d4813bb4d697ff2d3725337636bc652a77
usd:
  plug_info: plugin/resources/execVrm/plugInfo.json
tests:
  smoke:
    - tests/fixtures/humanoid_rig.usda
    - tests/fixtures/corrected_rig.usda
    - tests/fixtures/retargeted_rig.usda
  roundtrip:
    - tests/fixtures/humanoid_rig.usda
    - tests/fixtures/corrected_rig.usda
    - tests/fixtures/retargeted_rig.usda
