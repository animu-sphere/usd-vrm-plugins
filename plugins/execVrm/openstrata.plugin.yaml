# OpenStrata plugin bundle manifest.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: execVrm
  version: 0.9.0
  kind: usd-exec
license: Apache-2.0
runtime:
  # The one OpenUSD version this plugin supports; see usdVrmFileFormat's
  # manifest for why the tolerated range was retired in v0.6.0.
  openusd: "==26.08"
  cxx_abi: inherit
provides:
  # Three schemas, and exactly one plugin in a session may declare each. 26.08
  # keys its Exec.Schemas metadata by schema type and refuses a second declarer
  # with a coding error, dropping that plugin's computations for the schema --
  # so the two exec bundles partition them (WORKSPACE.md §2): `UsdSkelAnimation`
  # is execMotion's, and `UsdSkelSkeleton` and the Vrm*API applied schemas are
  # this bundle's. Only the ones it registers on are declared today; the rest of
  # the Vrm*API set is reserved for it by that contract, not by this list.
  #
  # UsdSkelBindingAPI joined for vrm.computeBindingPose: UsdSkel's animation
  # binding is inherited from an ancestor with the API applied, and no shipped
  # plugin declares that schema (execGeom declares UsdGeomScope and
  # UsdGeomXformable, execIr its own three).
  - usd-exec:UsdSkelBindingAPI
  - usd-exec:UsdSkelSkeleton
  - usd-exec:UsdVrmHumanoidAPI
requires:
  capabilities: [usd-stage-read]
  libraries:
    # The retarget core, and the one library every node here wraps: the rig a
    # computation answers with is `vrmRetarget`'s own `TargetSkeleton`,
    # `HumanoidMap`, `RestPoseCorrection` and `RetargetedPose`, which gained an
    # exact `operator==` for this bundle -- the registry's requirement, the ask
    # motionCore's aggregates answered in v0.6.0 -- and `JointLocalTransforms`,
    # a type the library gained for `vrm.computeJointLocalTransforms`.
    #
    # All of that was added after the v0.8.0 tag, and `TargetJoint::restScale`
    # with `DecomposeRestTransform` after it, which is why v0.9.0 is a minor
    # release: this range excludes the 0.8.0 package that lacks them
    # (PACKAGE_CONTRACT.md §3.1).
    - id: vrmRetarget
      version: ">=0.9,<0.10"
    # And the two it is built on, named rather than left to the closure: the
    # vocabulary a humanoid binds (`motion::HumanJoint`) is motionCore's, and a
    # bundle names what it spells.
    - id: motionCore
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:2aa549d1d764ef99527f31b71533133ac1c98e48843c63feccf6c69cc551219d
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:32b6ba1bc4b155278fbc388e24a0e9130f19540be9a980cb48bf049637bfe9e7
          cy2026-macos-arm64-py313-usd:
            digest: sha256:0a2c796e1929abcca6b4bba75509b8139a1fd757cb1c4fe6f9a165eee55e8d49
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:54f62ff034b02babe2470a78d78aa18c44b4c2245d09d53ec7d7af0ccc6888e0
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:f06fef790e19371c3d085c667e44805d738b63e8af77df2d8fafa6a41d5969a5
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:7e5c67b9ae5defa40887b7dbaccea0bb5258ae3e86b1e2d14e7c82ae13ce0564
    - id: motionSampling
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:f73acd91edc76075c0293163983516b4b7563b2c23d8511e2303985e3cd7b58d
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:df947a0faa5337ea0d91d5d2fffc21b3f0093e334d6aef8e4009703b7d680909
          cy2026-macos-arm64-py313-usd:
            digest: sha256:e6a263316fc56a4780031a719d364501285632a8175cf3f32bb478705b3b1435
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:fe0bbe82d6b64dd613b2763175d67c925647c0be93674332da3270f9b41dabbc
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:f991e0493a22081bc70c33abb89491263324c9b6931659e6b7e002b7f94a8080
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:e9da4e6148ac39a23b0f1c2a42dec77c533a9904472642578e27ed405d714f03
    - id: motionRecording
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:0adf068ddab28c02c323c599ab6f7e7f7490bcc5d2a84ead5ff8e92efee4e694
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:5be940a725eb6e08a223180b6e9bc597c9c4223ffe80d992ad63680af80e5d47
          cy2026-macos-arm64-py313-usd:
            digest: sha256:adcf943703474e77f9b8c99ada00803b15d250a57b4edcb34d2c10519b6aab21
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:a8f251798aece3df55f6491792356c6d699fe20338832a9da12c0daac8f8d07c
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:5a631f35759f33824da8a0dbc827b6304b5f177a970dc427ce024dffb0452c6c
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:4a16251c534a5a00897983159502f710d318a90657102c5a2e940dba3ef9382c
  # The typed Vrm*API schemas. Not linked: exec resolves `UsdVrmHumanoidAPI`
  # by TfType name when it reads this bundle's Exec block, so what this bundle
  # needs is vrmSchema's plugInfo registered in the session. Without it the
  # schema name is unknown and every computation on the humanoid is "not
  # found" -- measured in execVrm_humanoid.
  bundles:
    - id: vrmSchema
      version: ">=0.9,<0.10"
      contract: 1
    # execMotion, for the pose a retarget reads. Not linked either:
    # `vrm.computeBoundPose` reads `motion.sampleAnimation` by name across a
    # skeleton's `skel:animationSource`, and that computation is registered by
    # execMotion on `UsdSkelAnimation`, a schema this bundle may not declare
    # (WORKSPACE.md §2). Without it the rig computes and the animation is
    # dropped from the fan-in with no word from exec -- the bound pose's own
    # count is the only thing that notices, measured in
    # execVrm_retarget_without_exec_motion.
    - id: execMotion
      version: ">=0.9,<0.10"
usd:
  plug_info: plugin/resources/execVrm/plugInfo.json
tests:
  smoke:
    - tests/fixtures/humanoid_rig.usda
    - tests/fixtures/corrected_rig.usda
    - tests/fixtures/retargeted_rig.usda
  roundtrip:
    - tests/fixtures/humanoid_rig.usda
    - tests/fixtures/corrected_rig.usda
    - tests/fixtures/retargeted_rig.usda
