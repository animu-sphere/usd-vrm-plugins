# OpenStrata plugin bundle manifest.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: usdVrmaFileFormat
  version: 0.5.0
  kind: usd-fileformat
license: Apache-2.0
runtime:
  # The one OpenUSD version this plugin supports; see usdVrmFileFormat's
  # manifest for why the tolerated range was retired in v0.6.0.
  openusd: "==26.08"
  cxx_abi: inherit
provides:
  - usd-fileformat:vrma
requires:
  capabilities: [usd-stage-read]
  libraries:
    - id: vrmContainer
      version: ">=0.5,<0.6"
    - id: motionCore
      version: ">=0.5,<0.6"
usd:
  plug_info: plugin/resources/usdVrmaFileFormat/plugInfo.json
tests:
  smoke:
    - tests/fixtures/canonical_walk.vrma
    - tests/fixtures/expressive_face.vrma
  roundtrip:
    - tests/fixtures/canonical_walk.vrma
    - tests/fixtures/expressive_face.vrma
