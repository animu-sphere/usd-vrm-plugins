# OpenStrata plain-library descriptor. vrmAdapterVmc is an input leaf: it decodes
# one real-time protocol into canonical motion values and stops there.
#
# A library, not a plugin bundle, and deliberately so -- it registers nothing
# with OpenUSD and has no plugInfo.json (WORKSPACE.md §1). The three edges below
# are the *only* ones it is allowed (WORKSPACE.md §2); its CLI has its own
# openstrata.tool.yaml under tools/, which is where retarget and stage authoring
# become permissible.
#
# `liveTransport` is the third, and it is not a sibling edge wearing a hat: it
# is a leaf under libs/ with an empty edge set of its own, outside the aggregate
# product for the same reason an adapter is, holding the socket and the capture
# format this adapter and its sibling had written twice.
schema: openstrata.library/v1alpha1
library:
  id: vrmAdapterVmc
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.7.0
requires:
  libraries:
    - id: motionCore
      version: ">=0.7,<0.8"
    - id: motionRuntime
      version: ">=0.7,<0.8"
    - id: liveTransport
      version: ">=0.7,<0.8"
cmake:
  package: vrmAdapterVmc
  target: vrmAdapterVmc::vrmAdapterVmc
