# OpenStrata workspace-tool descriptor. `vrchat_osc_record` is the VRChat OSC
# adapter's CLI: the one part of this adapter a user runs, and the only part that
# meets a real sender (WORKSPACE.md §1 -- "each adapter may also carry one CLI,
# declared beside it as an openstrata.tool.yaml").
#
# It requires the adapter, `motionTracking` and `motionRuntime`. The second is
# the permission §2 grants an adapter's *tool* and refuses its library --
# assignment is an operator's statement about a rig, so a decoder that resolved
# it would have invented a calibration -- and VRC-6 is its first taker. The
# third is `WriteCaptureTraceFile` and nothing else: the hand-off to the product
# is a `motion-capture-trace` file.
#
# §2 also permits this tool to drive `vrmRetarget` and author a stage, which is
# what separates a tool from its library. It does neither, deliberately: the
# trace is the hand-off, and `motion_capture` is what replays one onto a rig
# knowing nothing about this adapter.
#
# `ost` 0.21.0 does not discover this file: workspace members are the project
# root's immediate subdirectories and `libs/`, so nothing under
# `adapters/<group>/<name>/tools/` is loaded (report 34). `ost` 0.22.x does, and
# WORKSPACE.md §5 records the member count that follows -- 10 rather than 9 -- so
# a workstation on the newer toolchain packaging one more member is the expected
# number rather than a new symptom. The root CMake tree builds the tool and CTest
# runs its tests; this descriptor is what makes the adapter's artifact
# expressible when a per-library packaging command exists, not a claim that one
# does today.
schema: openstrata.tool/v1alpha1
tool:
  id: vrchat_osc_record
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.7.0
  license: Apache-2.0
executables: [vrchat_osc_record]
directories: [bin]
requires:
  libraries:
    - id: vrmAdapterVrchatOsc
      version: ">=0.7,<0.8"
    # Named here where the sibling tools name only their adapter, and the
    # difference is the adapter's edge set rather than the tool's. Theirs link
    # `motionRuntime` because they deliver a pose; this one does not, so its
    # tool takes the edge itself.
    - id: motionTracking
      version: ">=0.7,<0.8"
    - id: motionRuntime
      version: ">=0.7,<0.8"
