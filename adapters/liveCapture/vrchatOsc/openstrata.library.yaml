# OpenStrata plain-library descriptor. vrmAdapterVrchatOsc is the third live
# input leaf, and the first that is not a pose source: what arrives on this wire
# is numbered tracker observations, which are pre-IK, so this library stops at a
# tracker frame and the humanoid solve is a separate and generic boundary
# (osc-and-vrchat-trackers.md §5).
#
# A library, not a plugin bundle, and deliberately so -- it registers nothing
# with OpenUSD and has no plugInfo.json (WORKSPACE.md §1). The four edges below
# are the only ones it is allowed (WORKSPACE.md §2), and neither sibling adapter
# is among them. That prohibition used to cost something real here: through
# VRC-0 `vrmAdapterVmc` held the only OSC decoder in this repository, and
# reaching across for it was the convenient thing to do the first time a datagram
# started with a '/'. OSC-3 removed the temptation rather than the rule -- the
# decoder is `libs/osc` and both adapters take it from there (§3.1).
#
# `liveTransport` and `osc` are the two shared leaves, and they are the reason
# this adapter never copied anything: the socket, the capture format and the
# diagnostic vehicle were extracted before this directory existed (§3.2), and
# the wire format was extracted the moment this adapter became its second
# consumer (§3.1).
#
# This library is *outside* the aggregate product, because it carries a
# product's name in the library itself and not only in data beside it
# (WORKSPACE.md §5).
schema: openstrata.library/v1alpha1
library:
  id: vrmAdapterVrchatOsc
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.7.0
#
# **Three edges, where §2 permits four, and the missing one is still the
# milestone rather than an oversight.** `motionCore` arrived with VRC-3, which
# is the first code here that produces a canonical value: the sender's axes into
# the canonical basis, which is a `GfVec3f` and a `GfQuatf` and reaches them
# through the library §2 routes an adapter's value types through.
# `motionRuntime` is what an adapter reaches when it produces a *pose*, and a
# tracker observation is not one — it is pre-IK, and the solve that makes it a
# pose is VRC-5's and generic. A manifest declaring it now would claim a
# dependency the library does not have.
requires:
  libraries:
    - id: motionCore
      version: ">=0.7,<0.8"
    - id: liveTransport
      version: ">=0.7,<0.8"
    - id: osc
      version: ">=0.7,<0.8"
cmake:
  package: vrmAdapterVrchatOsc
  target: vrmAdapterVrchatOsc::vrmAdapterVrchatOsc
