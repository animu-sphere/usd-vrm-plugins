# Motion-layer CI (hand-authored — NOT generated from openstrata.ci.yaml).
#
# Why this file exists at all
# ---------------------------
# `ost ci generate` emits one job per *bundle* cell. A plain CMake library
# (`openstrata.library.yaml`) and a CLI executable have no cell shape, so
# `motionCore`, `motionRuntime`, `vrmRetarget`, `motion_capture` and
# `motion_retarget` were compiled and tested only in the plain-CMake root build
# — which, until this workflow, no lane ran. v0.4.0 shipped that layer with zero
# CI coverage and said so in its release record; this lane closes it.
#
# It is a workaround, not the answer. The upstream ask is the P0 in
# docs/reports/ost/28-2026-07-26-v0.20.0-motion-layer-ci-gap.md: a cell shape
# for plain libraries and executables. Delete this file when ost grows one.
#
# What it does that no other lane does
# ------------------------------------
#   * builds the WHOLE workspace with plain CMake from the repo root, which is
#     the only configuration where libs/ and tools/ targets exist at all;
#   * runs the motion-layer ctests (motionCore, motionRuntime incl. the Phase D
#     live-capture surface and the capture corpus, vrmRetarget, and both CLIs);
#   * runs `usdvrm_baseline`, the whole-workspace behavior gate, which is also
#     registered only from the root build. Its symbol baseline is per-platform
#     and `--check` skips a platform with no committed file, so the Linux and
#     macOS cells verify everything except symbols;
#   * runs the WORKSPACE.md §2 dependency-graph gate — specified as a required
#     PR gate since Workspace Phase 1 and, until now, run by no lane either. It
#     validates plain libraries, not just bundles. It is read out of `--json`
#     because the verb that produces it also insists on testing every bundle;
#     see the step for why that matters.
#
# Runtime pins MIRROR openstrata.ci.yaml. Update both together; a motion cell
# on a different OpenUSD build than the bundle cells would be worse than no
# cell, because it would look like coverage.
#
# Fork-PR safety: never publishes, never promotes, uses no secrets.
name: motion ci

on:
  pull_request:

permissions:
  contents: read

env:
  OST_VERSION: "0.20.0"

jobs:
  motion:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    env:
      OST_HOME: ${{ github.workspace }}/.ost-ci-home
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: motion-windows
            runs_on: windows-2022
            runtime_artifact: sha256:e3368364f8f4661a7c34371e907f2e5ddcdec4e680b76f5e9e1c1ed656022f48
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:184cdbb42e9f01d4587429f6bfb3e3700f1cdbe3a6505e966edfec90a2f617f1"
            # Unlike the generated lane, every cell here needs a host Python:
            # this one drives plain CMake, and pxrConfig.cmake resolves Python
            # development components at configure time.
            host_python: "3.13"
          - name: motion-linux
            runs_on: ubuntu-24.04
            runtime_artifact: sha256:70b47d1b1a337b71d6c6fd63898e3295c0f91dc4b2ad2f5c09d14d6ac0ff2e1d
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:1a873111e4edf0cec7fdcf03e7bd2bbdf9723e1019cadcbcab9280c3229ac3af"
            host_python: "3.13"
          - name: motion-macos-arm64
            runs_on: macos-15
            runtime_artifact: sha256:b2cb7b68e72b05e486d57e96cde2ec7a8dc5a17b02b774af923aa58ee31d6d21
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:f8de29a4176d02ffbcf50a2205bb6b23d9a3cd9463e0d58a28a3c1c6ee5cb82c"
            host_python: "3.13"

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # OpenUSD 26.08's MaterialX 1.39.5 exports an unconditional
      # `find_dependency(X11 REQUIRED COMPONENTS Xt)` on non-Apple UNIX, and
      # pxrConfig.cmake find_dependency(MaterialX)s — so a Linux consumer cannot
      # even configure without X11 dev headers. Same reason as the hand-added
      # step in ost-source-ci.yml; see
      # docs/reports/ost/31-2026-07-26-v0.20.0-materialx-x11-ci-host-deps.md.
      - name: Install X11 dev headers required by MaterialX 1.39.5
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxt-dev

      - name: Hosted runner billing notice
        shell: bash
        run: echo "::notice title=OpenStrata hosted-runner usage::This job uses GitHub-hosted infrastructure. Private repositories may incur GitHub Actions usage charges."

      - name: Set up host Python
        if: ${{ matrix.host_python != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.host_python }}

      - name: Bootstrap ost (pinned release asset, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   triple=x86_64-unknown-linux-musl ; ext=tar.xz ;;
            macOS-ARM64) triple=aarch64-apple-darwin ; ext=tar.xz ;;
            macOS-X64)   triple=x86_64-apple-darwin ; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ; ext=zip ;;
            *) echo "::error title=ost bootstrap::no ost release asset for ${RUNNER_OS}-${RUNNER_ARCH}" ; exit 1 ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/animu-sphere/open-strata/releases/download/v${OST_VERSION}"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$( (command -v sha256sum > /dev/null && sha256sum "$asset" || shasum -a 256 "$asset") | cut -d' ' -f1 )"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo "::error title=ost bootstrap::no ost binary inside $asset" ; exit 1 ; fi
          chmod +x "$bin" 2> /dev/null || true
          bin_dir="$(cd "$(dirname "$bin")" && pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then bin_dir="$(cygpath -w "$bin_dir")"; fi
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Restore the artifact registry cache (speed only, never correctness)
        if: ${{ vars.OST_CI_DISABLE_CACHE != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.20.0-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.runtime_artifact }}

      - name: Pull and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          if ost artifact show "${{ matrix.runtime_artifact }}" --json > /dev/null 2>&1 \
             && ost artifact verify "${{ matrix.runtime_artifact }}" --require-sbom --require-provenance --json > /dev/null; then
            echo "pinned runtime already present and verified (cache hit)"
          else
            rm -rf "${OST_HOME}/artifacts"
            ost artifact pull "${{ matrix.runtime_remote }}" \
                --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime --json
          fi
          ost artifact verify ${{ matrix.runtime_artifact }} \
              --minimum-trust local --require-sbom --require-provenance
          ost runtime pull cy2026 --profile usd \
              --from-artifact ${{ matrix.runtime_artifact }} --force

      # The WORKSPACE.md §2 dependency-direction gate. It validates plain
      # libraries as well as bundles, so it is the only automated check that a
      # forbidden edge (say motionRuntime -> vrmSchema) has not been introduced,
      # and the only one that catches a half-bumped workspace.
      #
      # It is read out of --json rather than from the exit code, because `ost
      # plugin test --workspace` COUPLES the graph validation to testing every
      # bundle: on a fresh checkout it validates the graph, prints "valid", and
      # then exits non-zero because no bundle has been built yet
      # (WORKSPACE_LIBRARY_RUNTIME_MISSING / plugin.shared_library). Building all
      # four bundles here just to reach the graph result would duplicate the
      # twelve generated cells that already build and test them. `data.graph` is
      # a discrete result with its own `passed` and `issues`, so this asks for
      # exactly the part no other lane covers. Ask 5 in report 32 is a verb that
      # would make this a one-liner.
      - name: Validate the workspace dependency graph
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .ost-ci
          ost plugin test --workspace --up-to 0 --json > .ost-ci/workspace.json || true
          set -e
          python3 - <<'PY'
          import json, sys
          with open(".ost-ci/workspace.json", encoding="utf-8") as handle:
              graph = json.load(handle)["data"]["graph"]
          print(f'{len(graph["nodes"])} bundle(s), {len(graph["edges"])} bundle edge(s), '
                f'{len(graph["libraries"])} librar(ies), {len(graph["library_edges"])} library edge(s)')
          for issue in graph["issues"]:
              code = issue.get("code", "WORKSPACE_ISSUE")
              print(f'::error title={code}::{issue.get("message", issue)}')
          if not graph["passed"] or graph["issues"]:
              sys.exit(1)
          print("workspace dependency graph: valid")
          PY

      # Everything below runs inside an ost session, which puts the runtime on
      # PATH and exports CMAKE_PREFIX_PATH pointing at its prefix -- rather than
      # reaching into the runtime store's directory layout by hand.
      # pxrConfig.cmake does `find_dependency(Python3 COMPONENTS Development
      # Development.Module Development.Embed)`, so this needs Python *headers
      # and libraries*, not just an interpreter. The location is passed as a
      # CMake argument rather than left to the environment on purpose: the
      # generated lane never hits this because `ost plugin build` resolves
      # Python itself, and `ost plugin run` does not forward setup-python's
      # `Python3_ROOT_DIR` into the child, so CMake falls back to a system
      # Python that has no dev files ("Cannot find the directory
      # /usr/include/python3.13"). An argument survives whatever the session
      # does to the environment.
      - name: Configure the whole workspace (plain CMake, from the repo root)
        shell: bash
        run: |
          set -euo pipefail
          arguments=(-S . -B build/motion-ci
                     -DUSDVRM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release)
          python_root="${pythonLocation:-}"
          # CMake wants forward slashes; on Windows setup-python exports a
          # backslash path that bash would otherwise pass through as escapes.
          python_root="${python_root//\\//}"
          if [ -n "$python_root" ]; then
            arguments+=(-DPython3_ROOT_DIR="$python_root"
                        -DPython3_FIND_STRATEGY=LOCATION)
          else
            echo "::warning title=motion ci::no setup-python location; falling back to whatever CMake finds"
          fi
          ost plugin run plugins/vrmSchema -- cmake "${arguments[@]}"

      - name: Build
        shell: bash
        run: ost plugin run plugins/vrmSchema -- cmake --build build/motion-ci --config Release

      # Every target no bundle cell can reach: the motion libraries and CLIs,
      # plus vrmContainer, which the bundle cells compile as a dependency but
      # whose own unit tests likewise run only from the root build.
      #
      # `-R` rather than the whole suite because the bundle tests already have
      # twelve dedicated cells; duplicating them here would burn runner minutes
      # to re-prove what ost-source-ci.yml proves.
      - name: Run the library and CLI tests
        shell: bash
        run: |
          set -euo pipefail
          ost plugin run plugins/usdVrmaFileFormat \
              --with plugins/vrmSchema \
              -- ctest --test-dir build/motion-ci -C Release \
                       -R "motion|vrmRetarget|vrmContainer" --output-on-failure

      # The whole-workspace behavior gate. Registered only from the root build,
      # so this lane is the only place it runs. discovery.json freezes the union
      # across EVERY bundle, hence the explicit --with for the bundle that
      # registers a type without being anyone's dependency.
      - name: Run the Phase 0 baseline gate
        shell: bash
        run: |
          set -euo pipefail
          ost plugin run plugins/usdVrmFileFormat \
              --with plugins/usdVrmaFileFormat \
              --with plugins/usdVrmPackageResolver \
              --with plugins/vrmSchema \
              -- ctest --test-dir build/motion-ci -C Release \
                       -R usdvrm_baseline --output-on-failure

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motion-ci-${{ matrix.name }}
          path: |
            build/motion-ci/Testing/**
          retention-days: 7
          if-no-files-found: ignore
