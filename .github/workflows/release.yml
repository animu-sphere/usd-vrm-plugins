# Release workflow (hand-authored). The ost-*.yml workflows are generated from
# openstrata.ci.yaml; this one is not — but its runtime/bootstrap pins MIRROR
# openstrata.ci.yaml, so update both together. That mirroring includes the
# host-package steps the CI contract cannot express (see the X11 step below):
# because this file is hand-authored, regenerating the PR lanes never updates
# it, and a green PR lane proves nothing about it.
#
# Pushing a tag `vX.Y.Z` (which must equal the repo VERSION file and have a
# finalized CHANGELOG section) builds the whole workspace -- the four bundles
# vrmSchema, usdVrmFileFormat, usdVrmPackageResolver, usdVrmaFileFormat plus
# every CLI tool the workspace declares -- on the same three OS cells and
# digest-pinned runtimes as the PR lane, proves the *packaged* artifacts
# (composed clean-install smoke + digest reproducibility), then assembles a
# DRAFT GitHub release: per-target lean bundles and tool packages with manifest
# sidecars for all of them, a source archive, SHA256SUMS, and notes rendered
# from CHANGELOG.md via docs/contributing/RELEASE_NOTES_TEMPLATE.md. Publishing
# the draft is a human decision.
#
# The member set is NOT a constant here, and that is deliberate. It was `4 + 2`
# hard-coded and was wrong by v0.7.0, which ships `4 + 3`: `motion_bvh` joined
# as a tool member. The staging step below counts the descriptors in the tree
# instead and requires the packager to agree with them.
#
# It counts `tools/` and NOT `adapters/`, and that is the contract rather than
# an omission. WORKSPACE.md §5 keeps every adapter out of the aggregate product.
# Under the 0.21.0 pin this workflow used to carry, that exclusion held only
# because `ost` did not discover `adapters/<group>/<name>/tools/<tool>/` at all;
# 0.22.x does discover them, and the bootstrap pin below is 0.22.6 now. What
# keeps the product at seven members is therefore no longer the toolchain
# version but `[workspace].release_exclude` in openstrata.toml, which names the
# three adapter CLIs and makes `ost` itself fail with
# AGGREGATE_MEMBERSHIP_MISMATCH before this step runs.
#
# The count below stays anyway, and it is not a duplicate of that check. `ost`
# compares the packaged set against a declaration, and this step compares it
# against the tree. The declaration is what would be edited to make a mistake
# permanent: move `motion_bvh` into `release_exclude` and `ost` goes green --
# the packaged set equals the declared set, both simply missing a CLI the
# repository still builds -- while this step still finds three `tools/`
# descriptors and two packaged tools, and fails. Keeping both means the product
# is checked against something nobody can edit in the same commit.
#
# The three VRM bundles ship together because they must: an usdVrmFileFormat package
# on its own registers the `.vrm` format but cannot open a stage (see the
# comment on the clean-install smoke step, and ost report 23).
#
# `workflow_dispatch` is a dry run: the same build/verify/package lanes, with
# everything uploaded as workflow artifacts and no release object created.
#
# Fork-PR safety: runs only on tag push / manual dispatch, never on
# pull_request; the token stays read-only except for the release job.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (tag = VERSION, changelog finalized)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error title=release preflight::tag ${GITHUB_REF_NAME} does not match VERSION file ($file_version)" ; exit 1
            fi
            echo "version=$tag_version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$file_version" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the changelog section renders (finalized on a real release)
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ steps.version.outputs.is_release }}" != "true" ]; then
            extra="--allow-unreleased"
          fi
          python3 scripts/make_release_notes.py --version "${{ steps.version.outputs.version }}" $extra > /dev/null

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.runs_on }}
    env:
      OST_HOME: ${{ format('{0}/.ost-ci-home', github.workspace) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-windows
            cache_cell: usdvrmfileformat-pr-windows
            runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf"
            platform: cy2026
            profile: usd
            runs_on: ["windows-2022"]
            # The Windows runtime does not bundle python.exe: `ost plugin run
            # -- python` resolves the host PATH python, which must match the
            # runtime's py313 ABI for the clean-install smoke (`from pxr
            # import ...`). The runner's default python is 3.12 -> pin 3.13.
            host_python: "3.13"
          - name: release-macos-arm64
            cache_cell: usdvrmfileformat-pr-macos-arm64
            runtime_artifact: sha256:8d1322126b8f3aa4dd1791184603d7e1b4571bd4d6d89dd80bb75bdf5eef397c
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8486d94286b60cc20b53c926757f1802442569f9d9a7eecdadf2c9895b2efeb6"
            platform: cy2026
            profile: usd
            runs_on: ["macos-15"]
            host_python: "3.13"
          - name: release-linux
            cache_cell: usdvrmfileformat-pr-linux
            runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f"
            platform: cy2026
            profile: usd
            runs_on: ["ubuntu-24.04"]
            host_python: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # OpenUSD 26.08 bundles MaterialX 1.39.5, whose exported
      # MaterialXConfig.cmake gained
      #     if(UNIX AND NOT APPLE)
      #         find_dependency(X11 REQUIRED COMPONENTS Xt)
      # which the 1.39.4 in 26.05 did not have. The guard is platform-only, and
      # pxrConfig.cmake find_dependency(MaterialX)s, so every Linux consumer of a
      # 26.08 runtime needs X11 dev headers merely to run find_package(pxr) --
      # every configure in this job (build, test, package, --from-package) dies
      # at "Could NOT find X11 (missing: X11_X11_INCLUDE_PATH X11_X11_LIB Xt)"
      # without them. macOS (APPLE) and Windows (not UNIX) never enter the branch,
      # which is why only the Linux cell fails.
      #
      # The generated lanes no longer need a hand-added step: ost 0.21.0 grew a
      # per-cell `host_packages` knob and openstrata.ci.yaml declares it, so
      # regeneration re-renders their apt step. THIS workflow is hand-authored
      # and outside that contract, so the step below stays hand-maintained. It
      # was missed here when CI was re-pinned to 26.08 in 0ead959 and the v0.5.0
      # tag build failed on exactly this -- a green PR lane says nothing about
      # release.yml. Background:
      # docs/reports/ost/31-2026-07-26-v0.20.0-materialx-x11-ci-host-deps.md
      - name: Install X11 dev headers required by MaterialX 1.39.5
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxt-dev
      - name: Bootstrap ost 0.22.6 (pinned release asset, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   triple=x86_64-unknown-linux-musl ; ext=tar.xz ;;
            macOS-ARM64) triple=aarch64-apple-darwin ; ext=tar.xz ;;
            macOS-X64)   triple=x86_64-apple-darwin ; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ; ext=zip ;;
            *) echo "::error title=ost bootstrap::no ost release asset for ${RUNNER_OS}-${RUNNER_ARCH}" ; exit 1 ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/animu-sphere/open-strata/releases/download/v0.22.6"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$( (command -v sha256sum > /dev/null && sha256sum "$asset" || shasum -a 256 "$asset") | cut -d' ' -f1 )"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo "::error title=ost bootstrap::no ost binary inside $asset" ; exit 1 ; fi
          chmod +x "$bin" 2> /dev/null || true
          bindir="$(cd "$(dirname "$bin")" && pwd)"
          # GITHUB_PATH must hold a native path: a POSIX /d/a/... entry is
          # visible to bash but not to Windows CreateProcess (python subprocess
          # spawning `ost` in the clean-install smoke would fail).
          if command -v cygpath > /dev/null; then bindir="$(cygpath -w "$bindir")"; fi
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Check ost is available
        shell: bash
        run: |
          set -euo pipefail
          version="$(ost --version)"
          echo "$version"
          if [ "$version" != "ost 0.22.6" ]; then
            echo "::error title=ost bootstrap::expected 'ost 0.22.6', got '$version'" ; exit 1
          fi
      - name: Restore the artifact registry cache (speed only, never correctness)
        if: ${{ vars.OST_CI_DISABLE_CACHE != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.22.6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_cell }}-${{ matrix.runtime_artifact }}
      - name: Pull the pinned runtime SDK from its remote reference
        shell: bash
        run: |
          set -euo pipefail
          # The cache-hit test must use the SAME predicate as the gate below.
          # A cached record that verifies without evidence but fails the gate
          # would skip the pull and wedge the lane on every subsequent run,
          # because `ost artifact pull` cannot add evidence to a digest already
          # in the registry (import short-circuits on already_present and drops
          # the sidecars, printing "skipped sbom"). Failing this test instead
          # drops through to the eviction + fresh pull, which does attach it.
          if ost artifact show "${{ matrix.runtime_artifact }}" --json > /dev/null 2>&1 \
             && ost artifact verify "${{ matrix.runtime_artifact }}" --minimum-trust local \
                  --require-sbom --require-provenance --json > /dev/null; then
            echo "pinned runtime already present and verified (cache hit) -- skipping the remote pull"
          else
            rm -rf "${OST_HOME}/artifacts"
            ost artifact pull "${{ matrix.runtime_remote }}" --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime --json
          fi
      - name: Verify and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors the gate `ost ci generate` renders into the PR lanes: the
          # release lane must not verify the runtime more weakly than the lane
          # that gates the PRs feeding it.
          ost artifact verify ${{ matrix.runtime_artifact }} --minimum-trust local --require-sbom --require-provenance
          ost runtime pull ${{ matrix.platform }} --profile ${{ matrix.profile }} --from-artifact ${{ matrix.runtime_artifact }} --force
          ost runtime validate ${{ matrix.platform }} --profile ${{ matrix.profile }} --json > /dev/null
      - name: Set up host Python for schema tooling
        if: ${{ matrix.host_python != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.host_python }}
      # The release ships the whole workspace, not just the importer: since the
      # Phase 1 schema split an `usdVrmFileFormat` package alone registers the
      # `.vrm` format but cannot open a stage (ost stages a dependency bundle's
      # link half without its USD registration half). Build in dependency order;
      # `--workspace` exists on `test`/`package` but not on `build`.
      # The workspace tools (tools/*/openstrata.tool.yaml) are built by the ROOT
      # CMake tree, which no `ost plugin build` reaches -- without this step
      # `plugin package --workspace` fails with PRECONDITION_FAILED ("declares
      # executable ..., which is not in bin").
      #
      # ORDER MATTERS. The root build also rewrites each bundle's
      # plugins/<b>/lib/*.so|dylib|dll without recording bundle-managed
      # provenance, so running it AFTER the per-bundle builds makes
      # `plugin package` fail closed with PLUGIN_PACKAGE_OUTPUT_MISMATCH. Root
      # build first, per-bundle builds second. See ost report 33 §4.
      - name: Build the workspace root tree (plain libraries + CLI tools)
        shell: bash
        run: ost build --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --progress plain
      - name: Build every bundle from source (dependency order)
        shell: bash
        run: |
          set -euo pipefail
          for bundle in plugins/vrmSchema plugins/usdVrmFileFormat plugins/usdVrmPackageResolver plugins/usdVrmaFileFormat; do
            echo "::group::build $bundle"
            ost plugin build "$bundle" --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
            echo "::endgroup::"
          done
      - name: Run the verification pyramid against the build tree (whole workspace)
        shell: bash
        run: ost plugin test --workspace --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --up-to 5 --json
      - name: Package the workspace (lean bundles + aggregate product + split debug symbols)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          ost plugin package --workspace --product --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --json | tee .ost-ci/package.json
      - name: Prove packaging is digest-reproducible
        shell: bash
        run: |
          set -euo pipefail
          digests() {
            jq -r '(.data.packages[] | "\(.name) \(.archive_digest)"),
              ("product:\(.data.product.name) \(.data.product.archive_digest)")' "$1" | sort
          }
          digests .ost-ci/package.json > .ost-ci/digests-first.txt
          ost plugin package --workspace --product --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --json > .ost-ci/package-second.json
          digests .ost-ci/package-second.json > .ost-ci/digests-second.txt
          if ! diff -u .ost-ci/digests-first.txt .ost-ci/digests-second.txt; then
            echo "::error title=release packaging::two packaging runs of the same build disagree -- release checksums would be unstable" ; exit 1
          fi
          cat .ost-ci/digests-first.txt
      # The workspace form composes the three interdependent VRM artifacts. The bare
      # importer package remains intentionally useful as a regression probe:
      # it still fails L3/L4 until ost stages a dependency bundle's USD
      # registration half into the consumer package. The clean-install smoke
      # opens, validates, and texture-resolves real models across the composed
      # product. See ost reports 23 and 26.
      - name: Verify the packaged artifacts, composed (clean-install smoke)
        shell: bash
        run: python scripts/clean_install_smoke.py --skip-build
      # The other half of "the artifact works": the clean-install smoke opens
      # avatars through the four bundles, and nothing until 2026-08-30 had run a
      # *tool* member out of an installed product. WORKSPACE.md §5 ships the
      # motion profiles as product data so that this can pass, and the first run
      # of it failed -- the tool lands at `tools/<member>/bin/` and looked for
      # `<exe>/../share/...`, which is one directory too shallow inside the
      # product's own prefix.
      #
      # `--product` rather than a fresh package: the archive this step is about
      # is the one the previous steps just built and proved digest-reproducible,
      # and re-packaging here would smoke a different artifact than the one the
      # release stages.
      - name: Verify the packaged BVH path from the product alone
        shell: bash
        run: |
          set -euo pipefail
          product="$(jq -r '.data.product.archive // empty' .ost-ci/package.json)"
          if command -v cygpath > /dev/null; then product="$(cygpath -u "$product")"; fi
          # `// empty` and this guard together, for the reason the staging step
          # below has the same pair: a bare `jq -r` on a missing key prints the
          # string "null", `dirname` turns that into ".", and the smoke would be
          # pointed at the repository root and fail with a message about the
          # wrong thing.
          if [ -z "$product" ] || [ ! -f "$product" ]; then
            echo "::error title=release packaging::workspace product archive is missing" ; exit 1
          fi
          python scripts/artifact_only_bvh_smoke.py --product "$(dirname "$product")"
      - name: Verify the packaged VRMA reader independently
        shell: bash
        run: ost plugin test plugins/usdVrmaFileFormat --from-package --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --up-to 5 --json
      - name: Stage the release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p release-stage
          # `.data.packages` is EVERY member `ost` packaged, and since 0.22.x
          # that includes the adapter CLIs: ten archives here, seven of them the
          # release. `.data.release_members` is the aggregate's own membership,
          # resolved from openstrata.toml's `[workspace].release_members` minus
          # `release_exclude`, and it is the list both the assertion and the
          # staging loop below work from. Reading `.data.packages` directly is
          # what made this step count six tools against three descriptors.
          release_members="$(jq -c '.data.release_members // empty' .ost-ci/package.json)"
          if [ -z "$release_members" ] || [ "$release_members" = "null" ]; then
            echo "::error title=release packaging::this ost reports no .data.release_members -- the aggregate's membership would then be whatever the toolchain discovered, which is exactly what openstrata.toml [workspace].release_members exists to stop" ; exit 1
          fi
          jq --argjson rel "$release_members" '[.data.packages[] | select($rel | index(.name))]'              .ost-ci/package.json > .ost-ci/release-packages.json
          count="$(jq -r 'length' .ost-ci/release-packages.json)"
          bundles="$(jq -r '[.[] | select(.member == "bundle")] | length' .ost-ci/release-packages.json)"
          tools="$(jq -r '[.[] | select(.member == "tool")] | length' .ost-ci/release-packages.json)"
          product_members="$(jq -r '.data.product.members' .ost-ci/package.json)"
          # What the workspace declares, from the tree rather than from a
          # constant -- `.strata/` holds packaging copies of both descriptor
          # kinds and must not be counted. `tools/` only, never `adapters/`:
          # see the header comment for why that is the contract being enforced,
          # and why this stays beside openstrata.toml's `release_members`
          # instead of being replaced by it.
          # Asserted by member KIND so a tool silently dropping out cannot be
          # masked by a bundle count that still adds up.
          want_bundles="$(find plugins -name openstrata.plugin.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          want_tools="$(find tools -name openstrata.tool.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          echo "declared: $want_bundles bundle(s), $want_tools product tool(s); release members: $bundles + $tools; product: $product_members"
          if [ "$bundles" -ne "$want_bundles" ] || [ "$tools" -ne "$want_tools" ]; then
            echo "::error title=release packaging::the workspace declares $want_bundles bundle + $want_tools product tool descriptor(s), but the release set is $bundles + $tools -- reconcile openstrata.toml [workspace].release_members/release_exclude with the tree; if the difference is adapter CLIs, WORKSPACE.md section 5 needs a decision, not a bigger number" ; exit 1
          fi
          # The aggregate must contain that set and nothing else. `ost` fails on
          # its own before reaching here, so this catches only the case where it
          # does not: a version whose product and whose reported membership
          # disagree.
          if [ "$product_members" -ne "$count" ]; then
            echo "::error title=release packaging::the product carries $product_members member(s) but the release set has $count" ; exit 1
          fi
          # Only the release members are staged. Packaging also emits an
          # archive for each adapter CLI on its own -- every discovered member is
          # packaged whether or not it joins the aggregate -- and those are
          # deliberately not published. WORKSPACE.md section 5 ships an adapter
          # as `vrmAdapter<Name>-<version>-<target>` carrying its library WITH
          # its CLI, which `ost library package` can now produce and this lane
          # does not yet build; a bare `mocopi_record` archive is not that
          # artifact and must not be published in its place.
          for i in $(seq 0 $((count - 1))); do
            archive="$(jq -r ".[$i].archive" .ost-ci/release-packages.json)"
            name="$(jq -r ".[$i].name" .ost-ci/release-packages.json)"
            target="$(jq -r ".[$i].target" .ost-ci/release-packages.json)"
            debug="$(jq -r ".[$i].debug_archive // empty" .ost-ci/release-packages.json)"
            if command -v cygpath > /dev/null; then archive="$(cygpath -u "$archive")"; fi
            dist_dir="$(dirname "$archive")"
            cp "$archive" release-stage/
            if [ -n "$debug" ]; then
              if command -v cygpath > /dev/null; then debug="$(cygpath -u "$debug")"; fi
              # `debug_archive` may be a bare filename or a full path.
              case "$debug" in */*) cp "$debug" release-stage/ ;; *) cp "$dist_dir/$debug" release-stage/ ;; esac
            fi
            cp "$dist_dir/manifest.json" "release-stage/${name}-${version}-${target}.manifest.json"
          done
          product_archive="$(jq -r '.data.product.archive // empty' .ost-ci/package.json)"
          if command -v cygpath > /dev/null; then product_archive="$(cygpath -u "$product_archive")"; fi
          if [ -z "$product_archive" ] || [ ! -f "$product_archive" ]; then
            echo "::error title=release packaging::workspace product archive is missing" ; exit 1
          fi
          cp "$product_archive" release-stage/
          ls -l release-stage/
      - name: Upload the staged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: release-stage/
          if-no-files-found: error

  release:
    name: assemble release (draft)
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the per-target artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Add the source archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          git archive --format=tar.gz --prefix="usd-vrm-plugins-${version}/" \
            -o "dist-release/usd-vrm-plugins-${version}-src.tar.gz" HEAD
      - name: Write SHA256SUMS over every release file
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Render the release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ needs.preflight.outputs.is_release }}" != "true" ]; then
            extra="--allow-unreleased"
          fi
          python3 scripts/make_release_notes.py \
            --version "${{ needs.preflight.outputs.version }}" \
            --checksums dist-release/SHA256SUMS \
            --out release-notes.md $extra
          cat release-notes.md
      - name: Create the draft GitHub release
        if: ${{ needs.preflight.outputs.is_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ needs.preflight.outputs.version }}"
          gh release create "$tag" \
            --draft \
            --title "usd-vrm-plugins $tag" \
            --notes-file release-notes.md \
            dist-release/*
      - name: Upload the dry-run bundle (workflow_dispatch only)
        if: ${{ needs.preflight.outputs.is_release != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run
          path: |
            dist-release/
            release-notes.md
