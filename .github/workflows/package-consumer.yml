# Hand-authored (not generated by `ost ci generate`), and it has to be: the
# schema has two cell kinds and neither is this one.
#
#   error[MANIFEST_INVALID]: cells[N].kind: unknown variant `consumer`,
#   expected `bundle` or `workspace`
#
# PKG-4 of docs/roadmap/packaging-hardening.md. Every lane in this repository
# builds these packages *composed* — a workspace build defines every target as
# an alias in one CMake project, and `ost library build` composes
# `requires.libraries` the same way — so no lane opens a `*Config.cmake` at any
# point. On 2026-08-29 the configuration nothing ran was the one that failed:
# two adapters carried `osc::osc` on their installed interface link line with no
# `find_dependency(osc)` in either config, and all 17 lanes were green. They had
# to be.
#
# This lane is the consumer that is not us. Twelve external CMake projects, one
# per installed package, each configured against a prefix holding that package's
# transitive closure and nothing else — no build tree, no workspace, no source
# tree it can reach. It builds no workspace of its own, which is the property
# that makes it a separate lane rather than a step in the workspace cells.
#
# WHAT IT IS NOT ALLOWED TO BECOME. `release.yml` is the other hand-authored
# workflow here, and it hand-mirrors an X11 step, an `ost` pin and three runtime
# digests out of openstrata.ci.yaml. It was missed when CI was re-pinned to
# 26.08 and the v0.5.0 tag build failed on it while every PR lane stayed green.
# So this workflow copies no pin: the `pins` job below reads them from the CI
# contract through `ost ci matrix`, which exists for exactly that ("emit the
# resolved cells so a workflow `ost ci generate` cannot express can consume the
# same pins instead of copying them"). The runners, the runtime digests, the
# host packages and the Python version below are all that job's output. If the
# three workspace cells change platform, this lane changes with them; if they
# disappear, it fails rather than measuring something else.
#
# Fork-PR safety: this workflow never publishes, never promotes, and uses no
# secrets. The runtimes are public on GHCR.
name: package consumer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: read the pins from the CI contract
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ost_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read the pinned ost version out of the CI contract
        id: version
        shell: bash
        # The one pin that cannot come from `ost`, because it says which `ost`.
        # The next job's `ci_pins.py lane-matrix` re-reads the same value
        # through `ost ci matrix` and refuses to emit anything if the two
        # disagree, so this reading is checked by the tool it bootstrapped.
        run: echo "version=$(python3 scripts/ci_pins.py bootstrap-version)" >> "$GITHUB_OUTPUT"
      - name: Bootstrap ost
        uses: ./.github/actions/bootstrap-ost
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Validate the CI manifest
        shell: bash
        run: ost ci validate
      - name: Resolve the three platforms this lane runs on
        id: matrix
        shell: bash
        # `--expect 3` is the check, not a formality: criterion 6 asks whether
        # three platforms agree, and a run that asked it of two would answer a
        # different question and print a pass.
        run: echo "matrix=$(python3 scripts/ci_pins.py lane-matrix --expect 3)" >> "$GITHUB_OUTPUT"

  consume:
    name: consume-${{ matrix.os }}
    needs: pins
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    env:
      OST_HOME: ${{ github.workspace }}/.ost-ci-home
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Hosted runner billing notice
        shell: bash
        run: echo "::notice title=OpenStrata hosted-runner usage::This job uses GitHub-hosted infrastructure. Private repositories may incur GitHub Actions usage charges. Review repository billing and Actions usage settings."
      - name: Bootstrap ost
        uses: ./.github/actions/bootstrap-ost
        with:
          version: ${{ needs.pins.outputs.ost_version }}
      - name: Restore the artifact registry cache (speed only, never correctness)
        id: runtime-cache-restore
        if: ${{ vars.OST_CI_DISABLE_CACHE != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-${{ needs.pins.outputs.ost_version }}-${{ runner.os }}-${{ runner.arch }}-package-consumer-${{ matrix.runtime_artifact }}
      - name: Pull the pinned runtime SDK from its remote reference
        shell: bash
        run: |
          set -euo pipefail
          if ost artifact show "${{ matrix.runtime_artifact }}" --json > /dev/null 2>&1 \
             && ost artifact verify "${{ matrix.runtime_artifact }}" ${{ matrix.evidence_flags }} --json > /dev/null; then
            echo "pinned runtime already present and verified (cache hit) -- skipping the remote pull"
          else
            rm -rf "${OST_HOME}/artifacts"
            ost artifact pull "${{ matrix.runtime_remote }}" --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime --json
          fi
      - name: Verify and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          ost artifact verify ${{ matrix.runtime_artifact }} --minimum-trust ${{ matrix.minimum_trust }} ${{ matrix.evidence_flags }}
          ost runtime pull ${{ matrix.platform }} --profile ${{ matrix.profile }} --from-artifact ${{ matrix.runtime_artifact }} --force
      - name: Remove resumable transfer state before caching
        if: ${{ vars.OST_CI_DISABLE_CACHE != 'true' && steps.runtime-cache-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: rm -rf .ost-ci-home/artifacts/.partial-blobs
      - name: Save the verified artifact registry cache
        if: ${{ vars.OST_CI_DISABLE_CACHE != 'true' && steps.runtime-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-${{ needs.pins.outputs.ost_version }}-${{ runner.os }}-${{ runner.arch }}-package-consumer-${{ matrix.runtime_artifact }}
      - name: Install the host packages this runtime needs to be consumed
        # MaterialX 1.39.5 (OpenUSD 26.08) exports an unconditional
        # find_dependency(X11 REQUIRED COMPONENTS Xt) on non-Apple UNIX, so a
        # consumer of this runtime cannot configure without the dev headers.
        # Declared once, in openstrata.ci.yaml's `host_packages`, and read from
        # there — this lane's whole reason for existing is that a claim nobody
        # re-derives goes stale.
        if: ${{ matrix.host_packages_apt != '' || matrix.host_packages_brew != '' }}
        shell: bash
        env:
          HOST_PACKAGES_APT: ${{ matrix.host_packages_apt }}
          HOST_PACKAGES_BREW: ${{ matrix.host_packages_brew }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $HOST_PACKAGES_APT
              ;;
            macOS)
              brew install $HOST_PACKAGES_BREW
              ;;
            *)
              echo "error: host_packages has no installer for $RUNNER_OS" >&2
              exit 1
              ;;
          esac
      - name: Set up the host Python the runtime is built against
        if: ${{ matrix.host_python != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.host_python }}
      - name: Consume every installed package from outside the workspace
        shell: bash
        # No `ost build` before this, and that is the point: nothing in this
        # job's checkout is configured, so there is no build tree for a
        # consumer to resolve a target from by accident. The driver installs
        # each package's closure into a scratch prefix outside the repository
        # and configures the fixture against that prefix alone.
        run: |
          python scripts/run_package_consumer_lane.py \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }} \
            --reports package-consumer-reports
      - name: Upload the closures this platform measured
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-consumer-reports-${{ matrix.os }}
          path: package-consumer-reports/

  criterion-6:
    name: criterion 6 - three platforms agree
    needs: [pins, consume]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Download every platform's closures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: package-consumer-reports-*
          path: closures
      - name: Compare the closures across the three platforms
        # The one criterion no single host can answer, and the reason PKG-5's
        # POSIX half closes here rather than by someone remembering to run a
        # check: on a POSIX host `vrmAdapterMocopi` must carry the threading
        # library and no socket one, which is the absence Windows cannot see.
        run: python scripts/check_package_closures.py closures --json criterion-6.json
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-consumer-criterion-6
          path: criterion-6.json
