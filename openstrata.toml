[project]
name = "usd-vrm-plugins"
version = "0.9.0"

[requires]
platform = "cy2026"
profile = "usd"

# The member set, declared rather than discovered (ost 0.22.3).
#
# `members` only controls SOURCE discovery, and it is fail-closed: ost scans the
# tree and refuses any descriptor no pattern covers, so a new library cannot
# join the graph by existing. It is fail-closed the other way too, since 0.23.x:
# a descriptor left in the tree but out of this list is
# WORKSPACE_DESCRIPTOR_NOT_DECLARED, which is why MIG-4 deleted the six
# connector directories rather than merely unlisting them.
#
# Every member is named in full rather than matched by `plugins/*`-style globs.
# That began as a workaround and is kept as a choice. Under `ost` 0.22.3 and
# 0.22.4 a wildcard selected DIRECTORIES and a matched directory with no
# descriptor was a hard error, so one `tools/__pycache__` left by a test run made
# the whole graph refuse to resolve (WORKSPACE_MEMBER_DESCRIPTOR_MISSING).
# 0.22.5 treats a wildcard as a filter -- verified here on 2026-08-29: `tools/*`
# swept past the same `__pycache__` and reported the same 10 libraries and 16
# edges this list did that day. The count has moved twice since and is not
# restated here, which is the kind of number this file should not carry without
# running the command.
# What keeps the list is the second reason rather than the first: adding a
# member is a visible edit here rather than a side effect of creating a
# directory, which is the same demand `release_members` below makes and the same
# one WORKSPACE.md section 5 makes of the product.
#
# `release_members` is the aggregate product, and it is the reason this table
# exists at all. The exclusion it was written for -- the adapter CLIs, which
# WORKSPACE.md §5 kept out of the product -- is gone with MIG-4: every recorder
# is `motion-connectors`' now, and nothing in this tree has to be subtracted
# for carrying a producer's name. What the declaration still does is the
# general case: packaging subtracts `release_exclude` from
# the discovered bundle/tool ids and fails with AGGREGATE_MEMBERSHIP_MISMATCH if
# the result is not exactly this list. A new tool under `tools/` fails the lane
# until it is named here, which is the same demand release.yml's staging step
# makes and the reason both are kept.
[workspace]
members = [
  "plugins/execVrm",
  "plugins/usdVrmFileFormat",
  "plugins/usdVrmaFileFormat",
  "plugins/usdVrmPackageResolver",
  "plugins/vrmImaging",
  "plugins/vrmSchema",
  "libs/vrmContainer",
  "libs/vrmRig",
  "tools/motionRetarget",
  "tools/vrmExport",
]
release_members = [
  "vrmSchema",
  "execVrm",
  "usdVrmFileFormat",
  "usdVrmaFileFormat",
  "usdVrmPackageResolver",
  "vrmImaging",
  "motion_retarget",
  "vrm_export",
]
# Empty since MIG-4: the three adapter CLIs it named left for
# `motion-connectors`, and `ost` refuses an exclusion naming a member it does
# not discover (AGGREGATE_MEMBERSHIP_MISMATCH), so keeping them here stopped
# the release lane's packaging from 2026-09-21 until this was measured.
release_exclude = []

# No project-owned data is installed any more. The motion profiles were the one
# `[[workspace.install_data]]` mapping, and they left with MIG-3: they are
# `usd-motion-plugins`' installed data now, beside the converter that reads them.
